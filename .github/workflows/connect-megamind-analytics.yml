name: Connect existing analytics to Megamind

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Base64-encoded RSA public key for the owner's encrypted handoff
        required: true
        type: string

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check existing EU access and encrypt the connection
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          node --input-type=module <<'JS'
          import { createPublicKey, publicEncrypt } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const secret = process.env.POSTHOG_API_KEY?.trim();
          if (!secret) throw new Error('The existing PostHog connection is missing.');
          const recipient = createPublicKey(Buffer.from(process.env.RECIPIENT_PUBLIC_KEY, 'base64'));
          if (recipient.asymmetricKeyType !== 'rsa' || recipient.asymmetricKeyDetails.modulusLength < 4096) {
            throw new Error('Use an RSA public key with at least 4096 bits.');
          }
          let available = false;
          for (const project of ['208594', '148422']) {
            const response = await fetch(`https://eu.posthog.com/api/projects/${project}/query/`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${secret}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: { kind: 'HogQLQuery', query: "SELECT count() FROM events WHERE properties.$host IN ('sawiyya.com', 'www.sawiyya.com') AND timestamp >= now() - INTERVAL 1 DAY" } }),
              signal: AbortSignal.timeout(25000),
            });
            if (response.ok) {
              const result = await response.json();
              if (!Array.isArray(result.results)) throw new Error('Unexpected analytics response.');
              available = true;
              console.log(`Existing key can read EU project ${project}.`);
            } else {
              console.log(`EU project ${project} returned HTTP ${response.status}.`);
            }
          }
          if (!available) throw new Error('The saved connection cannot read either known EU project.');
          const encrypted = publicEncrypt({ key: recipient, oaepHash: 'sha256' }, Buffer.from(secret));
          writeFileSync('posthog-connection.enc', encrypted, { mode: 0o600 });
          console.log('Connection encrypted for the owner. No plaintext key is logged or uploaded.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: megamind-posthog-connection
          path: posthog-connection.enc
          retention-days: 1
          if-no-files-found: error
